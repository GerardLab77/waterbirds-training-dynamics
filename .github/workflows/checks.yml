name: Data rules and synthetic pipeline
on: [push, pull_request]
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: bash -n slurm/pilot.sbatch && bash -n slurm/comparison.sbatch && bash -n slurm/relative-pilot.sbatch && bash -n slurm/relative.sbatch
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python train.py --config configs/smoke.json --seed 42 --synthetic --device cpu --output scratch/full
      - run: python analyse.py scratch/full --config configs/smoke.json --output scratch/analysis --allow-synthetic
      - run: python train.py --config configs/smoke.json --seed 42 --synthetic --device cpu --output scratch/resumed --stop-after-epoch 1
      - run: python train.py --config configs/smoke.json --seed 42 --synthetic --device cpu --output scratch/resumed --resume
      - run: python check_resume.py scratch/full scratch/resumed
      - run: python analyse.py evidence/stanage/runs/comparison-v1 --config evidence/stanage/configs/comparison.json --output scratch/evidence-comparison
      - run: python detect.py evidence/stanage/runs/comparison-v1 --config evidence/stanage/configs/comparison.json --output scratch/evidence-detection
      - run: python train_relative.py --config configs/relative-smoke.json --reference-root scratch/full --seed 42 --synthetic --device cpu --output scratch/relative-full
      - run: python analyse_relative.py scratch/relative-full --reference-root scratch/full --config configs/relative-smoke.json --output scratch/relative-analysis --allow-synthetic
      - run: python train_relative.py --config configs/relative-smoke.json --reference-root scratch/full --seed 42 --synthetic --device cpu --output scratch/relative-resumed --stop-after-epoch 1
      - run: python train_relative.py --config configs/relative-smoke.json --reference-root scratch/full --seed 42 --synthetic --device cpu --output scratch/relative-resumed --resume
      - run: python check_resume.py scratch/relative-full scratch/relative-resumed --config configs/relative-smoke.json
